apiVersion: apps/v1
kind: Deployment
metadata:
  name: lineten-sre-assessment
  labels:
    app: lineten-sre-assessment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lineten-sre-assessment
  template:
    metadata:
      labels:
        app: lineten-sre-assessment
    spec:
      containers:
        - name: app
          image: ghcr.io/example/lineten-sre-assessment:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "kubernetes-example"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
